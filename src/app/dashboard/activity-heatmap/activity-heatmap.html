<div class="activity-heatmap__scroll">
  <div class="activity-heatmap__grid" role="group" [attr.aria-label]="'Daily activity heatmap, ' + weeks().length + ' weeks'">
    @for (week of weeks(); track $index) {
      <div class="activity-heatmap__week">
        <span class="activity-heatmap__month-label">{{ week.monthLabel ?? '' }}</span>
        @for (cell of week.days; track cell.date) {
          <button
            type="button"
            class="activity-heatmap__cell"
            [attr.data-level]="cell.level"
            [style.background]="cell.background"
            [attr.data-tooltip]="cell.tooltip"
            [attr.aria-label]="cell.tooltip"
          >
            @if (cell.marker) {
              <span class="activity-heatmap__cell-marker" [style.background]="cell.marker" aria-hidden="true"></span>
            }
          </button>
        }
      </div>
    }
  </div>
</div>

<div class="activity-heatmap__legend">
  <span>Less</span>
  <span class="activity-heatmap__cell activity-heatmap__cell--static" data-level="0"></span>
  <span class="activity-heatmap__cell activity-heatmap__cell--static" data-level="1"></span>
  <span class="activity-heatmap__cell activity-heatmap__cell--static" data-level="2"></span>
  <span class="activity-heatmap__cell activity-heatmap__cell--static" data-level="3"></span>
  <span>More</span>
</div>

@if (sources().length > 1) {
  <div class="activity-heatmap__source-legend">
    @for (source of sources(); track source.label) {
      <span class="activity-heatmap__source-key">
        <span class="activity-heatmap__source-swatch" [style.background]="swatchFor(source)"></span>
        {{ source.label }}
      </span>
    }
  </div>
}
